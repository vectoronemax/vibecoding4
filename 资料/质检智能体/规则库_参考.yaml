# 上海控规成果质检规则库 · 教学版
# 每条规则 = 一句条文 + 人定的口径 + 一个检查函数（qc_tools.py 按「检查」里的函数名去找）。
# 「参数」= 口径里的数值和代码表，写成工具能读的样子：工具一律从这里读，代码里不写数值。
# 规则由人审定签字；智能体只能「选规则、调工具、解释结果」，不能改这里的数值。
版本: 2026-11-04 教学版 v1.1
审定人: （讲师 / 学员本人签字）
说明: >
  依据均为上海公开发布的文件，条文以原文摘录；「口径」是本课程对条文的理解，正式质检以主管部门口径和现行文本为准。
  2016 修订版技术准则发布后，《上海市详细规划实施深化管理规定》（2020）等文件对部分内容有调整，课后用 D3-6 知识库核对。
修订记录:
  - v1（2026-10-20）：21 条规则
  - v1.1（2026-11-04）：每条规则加「参数」，数值与口径一致，未改任何数值；Q07、Q13 的「原文」改成与条文摘录逐字一致

依据文件:
  准则2016: 《上海市控制性详细规划技术准则（2016年修订版）》，上海市规划和国土资源管理局，2016-12-08 起执行
  成果规范2020: 《上海市控制性详细规划成果规范（2020试行版）》
  技术规定: 《上海市城市规划管理技术规定（土地使用 建筑管理）》，2003 年市政府令第 12 号发布，2010 年第 52 号令修正
  绿化审核: 《上海市绿化行政许可（协助）审核若干规定》第十五条（依据《上海市绿化条例》）

# 准则附录五「准则用词说明」→ 质检严重度
用词与严重度:
  必须 / 严禁: 错误
  应 / 不应 / 不得: 错误
  宜 / 不宜: 提示
  可: 不检查

规则:
  - id: Q01
    名称: 必填字段齐全
    类别: 数据完整性
    依据: 课程口径（成果数据通用要求；成果规范2020 的普适图则指标表）
    原文: ""
    用词: 应
    严重度: 错误
    适用: 全部地块；容积率、建筑高度只对可建设用地（R、C、M、W、U、S3、S4、S6、S9、Z、D）
    口径: 地块编号、街坊编号、用地代码、用地面积_m2、规划状态 不能空；可建设用地的容积率、建筑高度_m 不能空
    检查: check_required
    参数:
      必填字段: [地块编号, 街坊编号, 用地代码, 用地面积_m2, 规划状态]
      可建设用地必填: [容积率, 建筑高度_m]
      可建设用地代码前缀: [R, C, M, W, U, S3, S4, S6, S9, Z, D]

  - id: Q02
    名称: 地块编号唯一且格式统一
    类别: 数据完整性
    依据: 课程口径（成果数据通用要求）
    原文: ""
    用词: 应
    严重度: 错误
    适用: 全部地块
    口径: 编号格式为「街坊两位-地块两位」，如 03-02；前两位与街坊编号一致；同一单元内不重复
    检查: check_code
    参数:
      编号格式: '^\d{2}-\d{2}$'

  - id: Q03
    名称: 用地代码在分类表中
    类别: 用地分类
    依据: 准则2016 3.2.1、表3-1、表3-2
    原文: 城乡建设用地分为11个大类、50个中类、54个小类，见表3-2。
    用词: 应
    严重度: 错误
    适用: 全部地块（混合用地逐个代码检查）
    口径: 代码必须出现在表3-1 或表3-2 中，大小写敏感（Rr3 ≠ RR3）
    检查: check_landuse_code
    参数:
      # 课程代码表 = 条文摘录「表3-2 用到的代码」+ 各条口径里出现的代码；正式质检用准则原文表3-1、表3-2 全表
      代码表: [R, C, M, W, T, S, U, G, D, X, K, Z,
            Rr, Rr1, Rr2, Rr3, Rr4, Rr5, Rr6, Rc, Rc1, Rc2, Rc3, Rc4, Rc5, Rc6, Rc9, Rs, Rs1, Rs2, Rs3, Rs4, Rs5, Rs6,
            C2, C21, C22, C23, C24, C3, C5, C51, C52, C53, C54, C8,
            M1, M2, M3, M4, W1, W2, W3, W4,
            S1, S3, S4, S5, S51, S52, S6, S9, U3, U31, U6, G1, G11, G12, G2, Xc, Xu, Xx]

  - id: Q04
    名称: 用地分类深度：居住用地必须分至小类
    类别: 用地分类
    依据: 准则2016 3.2.2
    原文: 控制性详细规划用地分类除以下情况外一般分至中类。（1）居住用地必须分至小类。（2）城市发展备建用地、控制用地可分至大类。
    用词: 必须（居住）/ 一般（其余）
    严重度: 错误（居住未分至小类）；提示（其余大类只写到大类）
    适用: 全部地块
    口径: R、Rr、Rc、Rs 是错误；C、M、W、T、S、U、G、D 只写大类给提示；X、K、Z 可只写大类
    检查: check_landuse_depth
    参数:
      必须分至小类: [R, Rr, Rc, Rs]
      只写大类给提示: [C, M, W, T, S, U, G, D]
      可只写大类: [X, K, Z]

  - id: Q05
    名称: 混合用地比例
    类别: 用地分类
    依据: 准则2016 3.4.1
    原文: 混合用地是指一个地块内有两类或两类以上使用性质的建筑，且每类性质的地上建筑面积占地上总建筑面积的比例均大于10%的用地。
    用词: 定义
    严重度: 错误
    适用: 填了「混合比例」的地块
    口径: 每类占比必须 > 10%；各类合计必须 = 100%（> 90% 的应按单一性质填报）
    检查: check_mix_ratio
    参数:
      单类占比下限_pct: 10
      合计_pct: 100

  - id: Q06
    名称: 禁止混合的用地
    类别: 用地分类
    依据: 准则2016 3.4.4
    原文: （1）严禁三类工业用地、危险品仓储用地、公共卫生设施用地与其它任何用地混合。（2）严禁特殊用地与其它任何用地混合。（3）严禁二类工业用地与居住用地、公共设施用地混合。
    用词: 严禁
    严重度: 错误
    适用: 填了「混合比例」的地块
    口径: M3、W2、C53、D* 不能和任何代码混合；M2 不能和 R*、C* 混合
    检查: check_mix_forbidden
    参数:
      不得与任何用地混合: [M3, W2, C53, D]
      不得互相混合: [[M2, R], [M2, C]]

  - id: Q07
    名称: 街坊开发强度不超过强度区上限
    类别: 开发强度
    依据: 准则2016 2.1.11、4.2.3、4.2.4、4.3.2、表4-1
    原文: 在各级强度区内，某一街坊50%以上（含50%）的用地位于轨道交通站点300米服务范围内（见附录二），该街坊采用此级强度区的特定强度。此强度区的其它街坊采用相应的基本强度。
    用词: 应
    严重度: 错误（超上限）；提示（低于基本强度下限）
    适用: 主城区；住宅组团用地（Rr1–Rr4）、商业服务业与商务办公用地（C2*、C8）
    口径: >
      ① 开发强度是「街坊内该类用地的平均容积率」= 建筑面积之和 ÷ 用地面积之和，不按单个地块判（2.1.11、4.2.4）；
      ② 混合用地按比例拆分（3.4.2）；③ 特定强度：街坊用地 ≥ 50% 落在已运营轨交站点中心 300 米内（附录二只有示意图，课程按站点中心点算，在建站不算）；
      ④ 用地面积按几何量算（EPSG:32651），不用属性表里的面积
    参数:
      住宅:   {I: [null, 1.2, null], II: [1.2, 1.6, null], III: [1.6, 2.0, 2.5], IV: [2.0, 2.5, 3.0, 不含上限], V: [2.5, 2.5, 不设上限]}
      商办:   {I: [1.0, 2.0, null], II: [2.0, 2.5, null], III: [2.5, 3.0, 4.0], IV: [3.0, 3.5, 5.0], V: [3.5, 4.0, 不设上限]}
      格式: "[基本强度下限, 基本强度上限, 特定强度上限]；null = 表中为「—」，没有特定强度"
      住宅代码: [Rr1, Rr2, Rr3, Rr4]
      商办代码前缀: [C2, C8]
      站点服务半径_m: 300
      特定强度用地占比下限: 0.5
      计入的站点状态: [运营]
      适用区位: 主城区
    检查: check_intensity

  - id: Q08
    名称: 不得建设超高层住宅
    类别: 建筑高度
    依据: 准则2016 6.2.5
    原文: 不宜采取低层与高层住宅建筑组合的形式。不得建设超高层（100米以上）住宅建筑。
    用词: 不得
    严重度: 错误
    适用: 住宅组团用地（Rr*）
    口径: 建筑高度_m > 100 即违反
    检查: check_residential_height
    参数:
      住宅代码前缀: [Rr]
      高度上限_m: 100

  - id: Q09
    名称: 地块高度不超过高度分区上限
    类别: 建筑高度
    依据: 准则2016 5.3.1、表5-3
    原文: 地块建筑高度的上限，应控制在相应高度分区的指标范围内。
    用词: 应
    严重度: 错误
    适用: 所有填了建筑高度的地块
    口径: 一级 ≤10 米、二级 ≤24 米、三级 ≤50 米、四级 ≤100 米、五级不设上限；分区取所在街坊的「高度分区」
    检查: check_height_zone
    参数:
      分区上限_m: {一级: 10, 二级: 24, 三级: 50, 四级: 100, 五级: null}

  - id: Q10
    名称: 工业用地容积率不宜低于 1.2
    类别: 开发强度
    依据: 准则2016 4.5.1
    原文: 为提高土地使用效率，工业用地的容积率指标不宜低于1.2，使用特殊工艺的工业用地，其容积率指标可根据实际情况具体确定。
    用词: 不宜
    严重度: 提示
    适用: 单一性质的工业用地（M1、M2、M3；M4 工业研发按 4.5.2 参照商办）
    口径: 容积率 < 1.2 给提示；备注写了「特殊工艺」的不提示
    检查: check_industrial_far
    参数:
      工业代码: [M1, M2, M3]
      容积率下限: 1.2
      例外关键词: 特殊工艺

  - id: Q11
    名称: 基础教育设施数量
    类别: 公共服务设施
    依据: 准则2016 7.5.1
    原文: 每5万人应配置一所高中，每2.5万人应配置一所初中和一所小学，每1万人应配置一所幼儿园。
    用词: 应
    严重度: 错误
    适用: 整单元控规（成果信息里有规划人口）
    口径: 需配所数 = 规划人口 ÷ 门槛 向上取整；九年一贯制（Rs5）同时计 1 所小学和 1 所初中；完全中学（Rs1）同时计 1 所初中和 1 所高中
    检查: check_school_count
    参数:
      每所服务人口_万人: {高中: 5, 初中: 2.5, 小学: 2.5, 幼儿园: 1}
      代码计数: {Rs1: [初中, 高中], Rs2: [高中], Rs3: [初中], Rs4: [小学], Rs5: [小学, 初中], Rs6: [幼儿园]}

  - id: Q12
    名称: 新建中小学用地南北向长度
    类别: 公共服务设施
    依据: 准则2016 7.5.3
    原文: 新建中学用地南北向最大长度不得小于120米，新建小学用地南北向最大长度不得小于80米。
    用词: 不得
    严重度: 错误
    适用: 规划状态为「新建」的 Rs1–Rs5
    口径: 南北向最大长度 = 地块在 EPSG:32651 下外包矩形的南北边长；九年一贯制按中学 120 米
    检查: check_school_ns_length
    参数:
      南北向最小长度_m: {Rs1: 120, Rs2: 120, Rs3: 120, Rs5: 120, Rs4: 80}
      适用状态: 新建

  - id: Q13
    名称: 需独立用地的社区设施
    类别: 公共服务设施
    依据: 准则2016 7.4.2、表7-3（序 2 派出所、序 13 社区卫生服务中心）
    原文: 派出所——每个街道（镇）设一处，需独立用地；社区卫生服务中心——每个街道（镇）设一处，需独立用地。
    用词: 需（按「应」处理）
    严重度: 错误
    适用: 整单元控规（本单元按一个街道级居住社区）
    口径: 派出所要有一块 Rc1 地块、社区卫生服务中心要有一块 Rc5 地块，且「配套设施」写明该设施；只写在别的地块「配套设施」里 = 未独立用地
    检查: check_independent_facility
    参数:
      设施: [{名称: 派出所, 代码: Rc1}, {名称: 社区卫生服务中心, 代码: Rc5}]

  - id: Q14
    名称: 独立用地的小型公共空间比例
    类别: 公共空间
    依据: 准则2016 5.5.1、5.5.4、表5-5、5.5.5
    原文: 执行表5-5要求确有困难的建成区，独立用地的小型公共空间用地面积比例要求可按照0.8的系数进行折减，不足部分应通过地块内空间向公众开放的方式进行补足。
    用词: 应
    严重度: 错误；落在折减区间内为「待确认」（要人判断是否属于「确有困难的建成区」）
    适用: 整单元控规
    口径: >
      分子 = 面积 < 4 公顷的公共绿地（G1、G11、G12）+ 面积 < 2 公顷的广场（S5、S51、S52）；分母 = 单元总用地面积；
      标准按表5-5 取：区位（内环内 / 主城区内环外 / 新城、新市镇）× 功能区域（居住社区按规划人口密度是否 > 2.5 万人/km²）；
      注「大型公共空间周边 500 米范围内的用地可不计入」课程不扣除
    参数:
      居住社区: {内环内: [7, 6], 主城区内环外: [8, 7], 新城新市镇: [9, 8]}
      公共活动中心区: {内环内: 8, 主城区内环外: 11, 新城新市镇: 12}
      格式: "居住社区 [密度 > 2.5 万人/km², 密度 ≤ 2.5 万人/km²]，单位 %"
      公共绿地代码: [G1, G11, G12]
      公共绿地面积上限_m2: 40000
      广场代码: [S5, S51, S52]
      广场面积上限_m2: 20000
      人口密度分界_万人每平方公里: 2.5
      折减系数: 0.8
    检查: check_small_public_space

  - id: Q15
    名称: 单个广场不得大于 2 公顷
    类别: 公共空间
    依据: 准则2016 5.5.8
    原文: 鼓励设置中小尺度的广场，单个广场的面积宜在300-2000平方米之间。除因特定功能要求外，不得设置面积大于2公顷的大型广场。
    用词: 不得
    严重度: 错误
    适用: S5、S51、S52
    口径: 几何面积 > 20,000 平方米即违反；备注写了「特定功能」的改为提示
    检查: check_plaza_size
    参数:
      广场代码: [S5, S51, S52]
      面积上限_m2: 20000
      例外关键词: 特定功能

  - id: Q16
    名称: 人均社区级及以下公共绿地
    类别: 公共空间
    依据: 准则2016 8.3.1
    原文: 在新建地区，人均社区及以下级公共绿地面积不得低于4平方米。在建成区，应结合城市更新，增加公共绿地。
    用词: 不得（新建地区）
    严重度: 错误（新建地区）；提示（建成区，不强制）
    适用: 整单元控规
    口径: 公共绿地（G1、G11、G12）几何面积之和 ÷ 规划人口；地区类型取成果信息
    检查: check_green_per_capita
    参数:
      公共绿地代码: [G1, G11, G12]
      人均下限_m2: 4

  - id: Q17
    名称: 地块绿地率
    类别: 生态环境
    依据: 技术规定 第五十三条；绿化审核 第十五条
    原文: 新建居住区内绿地面积占居住区用地总面积的比例不得低于百分之三十五……按照规划成片改建、扩建居住区的绿地面积不得低于居住区用地总面积的百分之二十五。新建学校、医院、疗休养院所、公共文化设施，其附属绿地面积不得低于单位用地总面积的百分之三十五。
    用词: 不得
    严重度: 错误
    适用: 住宅组团用地（新建 ≥ 35%，改建 ≥ 25%）；新建的学校（Rs*）、医院（C5*、Rc5）、文化设施（C3*、Rc3）≥ 35%；「保留」不查
    口径: 按地块的绿地率_% 核（控规把绿地率落到地块）
    检查: check_green_ratio
    参数:
      住宅代码前缀: [Rr]
      住宅下限_pct: {新建: 35, 改建: 25}
      公建代码前缀: [Rs, C5, Rc5, C3, Rc3]
      公建新建下限_pct: 35

  - id: Q18
    名称: 用地面积与几何面积一致
    类别: 几何与拓扑
    依据: 准则2016 3.2.3
    原文: 地块用地面积应按照地块边界的水平投影进行量算。
    用词: 应
    严重度: 错误
    适用: 几何有效的地块
    口径: 在 EPSG:32651 下量算；与「用地面积_m2」相差超过 1% 即报
    检查: check_area_consistency
    参数:
      相对误差上限_pct: 1

  - id: Q19
    名称: 地块之间不重叠
    类别: 几何与拓扑
    依据: 课程口径（成果数据拓扑要求）
    原文: ""
    用词: 应
    严重度: 错误
    适用: 几何有效的地块
    口径: 两两相交面积 > 1 平方米即报，报两块的编号和重叠面积
    检查: check_overlap
    参数:
      重叠面积下限_m2: 1

  - id: Q20
    名称: 几何有效
    类别: 几何与拓扑
    依据: 课程口径（成果数据拓扑要求）
    原文: ""
    用词: 应
    严重度: 错误
    适用: 全部地块
    口径: 自相交、空几何都算无效；无效地块不再做 Q12、Q18、Q19 等几何检查，先退回修正
    检查: check_geometry_valid

  - id: Q21
    名称: 说明书与指标表一致
    类别: 成果一致性
    依据: 成果规范2020（文本、图则、说明书构成一套成果）；课程口径
    原文: ""
    用词: 应
    严重度: 错误
    适用: 有说明书的成果
    口径: 说明书里的数字（规划人口、总用地、总建筑面积、学校所数、公共绿地面积）与指标表算出来的值比：数量要相等，面积相差 > 2% 即报。说明书里的数由大模型读出来，比对由工具做
    检查: compare_claims
    参数:
      面积容差_pct: 2
      比对项: {规划人口: 万人, 总用地: 公顷, 总建筑面积: 万平方米, 公共绿地: 公顷, 幼儿园: 所, 小学: 所, 初中: 所, 九年一贯制学校: 所, 高中: 所, 完全中学: 所}
      学校代码: {幼儿园: Rs6, 小学: Rs4, 初中: Rs3, 九年一贯制学校: Rs5, 高中: Rs2, 完全中学: Rs1}
      公共绿地代码: [G1, G11, G12]

# 写进规则库、但明确「不查」的条文——避免智能体自作主张套用
不适用:
  - 条文: 技术规定 表二「建筑密度和建筑容积率控制指标表」
    为什么不查: 表二注 2：本表仅适用于未编制详细规划的、小于或等于 3 万平方米的单一基地。控规成果的地块指标不按表二判
  - 条文: 技术规定 第二十三条至第二十八条「建筑间距」
    为什么不查: 是建设工程设计方案阶段的审查内容，控规地块表里没有建筑单体
  - 条文: 准则2016 附录一「主城区强度区划分方法」
    为什么不查: 强度区以上位规划为准；复算要全市各线路站点数据（课后挑战）
